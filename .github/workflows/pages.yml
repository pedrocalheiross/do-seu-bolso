# Publica só os arquivos do site; planilhas, build.js etc. ficam fora.
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Arquivo novo do site precisa entrar nesta lista.
      - run: mkdir _site && cp index.html termos.html estilo.css precos.json favicon.png logo.png compartilhar.png CNAME _site/ && cp -R imagens _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
